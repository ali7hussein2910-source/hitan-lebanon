<script>
const APP_URL = "https://script.google.com/macros/s/AKfycbzyM_gJsIV-icWDh_sy95KhPqsQpeLlS6eyl__O2zVs1aZyQf-Bp5ja_FrhW9icSHuY/exec";
let ADMIN_PIN = "";

function login(){
  const pin = document.getElementById("pin").value.trim();
  if(!pin) return;
  ADMIN_PIN = pin; loadDashboard();
}

async function loadDashboard(){
  try{
    const statsResponse = await fetch(APP_URL + "?action=adminStats&pin=" + encodeURIComponent(ADMIN_PIN));
    const stats = await statsResponse.json();
    if(!stats.success){
      document.getElementById("loginMessage").innerHTML = `<span style="color:#dc2626">${escapeHtml(stats.message || "رمز الدخول غير صحيح")}</span>`;
      return;
    }
    document.getElementById("loginBox").classList.add("hidden");
    document.getElementById("dashboard").classList.remove("hidden");
    document.getElementById("pending").innerText = stats.pending;
    document.getElementById("activeOrders").innerText = stats.activeOrders;
    document.getElementById("available").innerText = stats.available;
    document.getElementById("reserved").innerText = stats.reserved;
    document.getElementById("activeUnits").innerText = stats.active;
    document.getElementById("revenue").innerText = "$" + stats.revenue;
    await loadOrders();
  }catch(error){ alert("تعذر الاتصال بالسيرفر."); }
}

async function loadOrders(){
  const response = await fetch(APP_URL + "?action=adminOrders&pin=" + encodeURIComponent(ADMIN_PIN));
  const data = await response.json();
  if(!data.success){ alert(data.message); return; }
  renderOrders(data.orders);
}

function renderOrders(orders){
  const container = document.getElementById("orders");
  container.innerHTML = "";
  if(!orders.length){
    container.innerHTML = "<p style='color:#6b7280; text-align:center; padding:30px;'>لا توجد طلبات حالياً.</p>"; return;
  }
  orders.reverse().forEach(order => {
    const div = document.createElement("div"); div.className = "order";
    let statusClass = order.orderStatus === "Active" ? "active" : (order.orderStatus === "Rejected" ? "rejected" : "pending");
    let logo = order.logo ? `<img class="logo" src="${escapeHtml(order.logo)}" alt="Logo">` : "";
    let actions = "";
    if(order.orderStatus === "Pending"){
      actions = `<button class="approve" onclick="approveOrder('${escapeJs(order.orderId)}')">✅ تأكيد الدفع ونشر الإعلان</button>
                 <button class="reject" onclick="rejectOrder('${escapeJs(order.orderId)}')">❌ رفض الطلب</button>`;
    }
    actions += `<button class="delete-btn" onclick="deleteOrderPrompt('${escapeJs(order.orderId)}')">🗑️ حذف الإعلان وإتاحة المساحة</button>`;
    div.innerHTML = `
      <div class="order-header">
        <div class="order-id">رقم الطلب: ${escapeHtml(order.orderId)}</div>
        <div class="badge ${statusClass}">${escapeHtml(order.orderStatus || "Pending")}</div>
      </div>
      <div class="details">
        <div class="detail"><b>الاسم</b>${escapeHtml(order.customerName)}</div>
        <div class="detail"><b>الهاتف</b>${escapeHtml(order.phone)}</div>
        <div class="detail"><b>نوع المساحة</b>${escapeHtml(order.unitType)}</div>
        <div class="detail"><b>عدد الوحدات</b>${escapeHtml(order.unitsCount)}</div>
        <div class="detail"><b>المبلغ</b>$${escapeHtml(order.totalAmount)}</div>
        <div class="detail"><b>حالة الدفع</b>${escapeHtml(order.paymentStatus)}</div>
        <div class="detail"><b>اسم الإعلان</b>${escapeHtml(order.adName || "-")}</div>
        <div class="detail"><b>تنسيق النص</b>اللون: <span style="background:${escapeHtml(order.fontColor || '#111')}; color:#fff; border:1px solid #ccc; padding:2px 8px; border-radius:4px;">${escapeHtml(order.fontColor || '#111')}</span> | الشكل: ${escapeHtml(order.fontStyle || 'normal')}</div>
      </div>
      ${logo}
      <div style="margin:10px 0; font-size:14px;"><b>النص الإضافي:</b>
        <div style="background:#f9fafb; padding:8px 12px; border-radius:8px; margin-top:4px;">${escapeHtml(order.adText || "لا يوجد")}</div>
      </div>
      <div style="display:flex; gap:15px; margin:10px 0; font-size:13px; color:#4b5563;">
        <div><b>WhatsApp:</b> ${escapeHtml(order.whatsapp || "-")}</div>
        <div><b>Instagram:</b> ${escapeHtml(order.instagram || "-")}</div>
      </div>
      <div class="actions">${actions}</div>
    `;
    container.appendChild(div);
  });
}

async function approveOrder(orderId){
  if(!confirm("هل تريد تأكيد الدفع ونشر هذا الإعلان؟")) return;
  try{
    const response = await fetch(APP_URL,{ method:"POST", headers:{"Content-Type":"text/plain;charset=utf-8"}, body:JSON.stringify({action:"confirmPayment", orderId:orderId, pin:ADMIN_PIN}) });
    const result = await response.json();
    if(!result.success){ alert(result.message); return; }
    alert("تم تأكيد الدفع ونشر الإعلان بنجاح ✅"); await loadDashboard();
  }catch(error){ alert("حدث خطأ أثناء تأكيد الدفع."); }
}

async function rejectOrder(orderId){
  if(!confirm("هل أنت متأكد من رفض هذا الطلب؟")) return;
  try{
    const response = await fetch(APP_URL,{ method:"POST", headers:{"Content-Type":"text/plain;charset=utf-8"}, body:JSON.stringify({action:"rejectOrder", orderId:orderId, pin:ADMIN_PIN}) });
    const result = await response.json();
    if(!result.success){ alert(result.message); return; }
    alert("تم رفض الطلب وإعادة المساحة إلى متاحة."); await loadDashboard();
  }catch(error){ alert("حدث خطأ أثناء رفض الطلب."); }
}

async function deleteOrderPrompt(orderId){
  if(!confirm("هل أنت متأكد من حذف هذا الإعلان؟ ستعود المساحات المرتبطة به متاحة للحجز.")) return;
  try {
    const response = await fetch(APP_URL, { method: "POST", headers: { "Content-Type": "text/plain;charset=utf-8" }, body: JSON.stringify({ action: "deleteOrder", orderId: orderId, pin: ADMIN_PIN }) });
    const result = await response.json();
    if(!result.success){ alert(result.message); return; }
    alert("تم حذف الإعلان وإعادة تحرير المساحات بنجاح ✅"); await loadDashboard();
  } catch (error) { alert("حدث خطأ أثناء حذف الإعلان."); }
}

async function deleteAllAdsPrompt(){
  if(!confirm("⚠️ تحذير: هل أنت متأكد من حذف جميع الإعلانات والطلبات وإعادة جميع المساحات الحالية متاحة؟ لا يمكن التراجع عن هذا الإجراء.")) return;
  try {
    const response = await fetch(APP_URL, { method: "POST", headers: { "Content-Type": "text/plain;charset=utf-8" }, body: JSON.stringify({ action: "deleteAllAds", pin: ADMIN_PIN }) });
    const result = await response.json();
    if(!result.success){ alert(result.message); return; }
    alert("تم حذف جميع الإعلانات وإتاحة كافة المساحات بنجاح ✅"); await loadDashboard();
  } catch (error) { alert("حدث خطأ أثناء حذف جميع الإعلانات."); }
}

// دالة الرفع تم تعديلها لتصغير الصورة قبل الرفع
async function handleWallBgUpload(event){
  const file = event.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = function(e) {
    const img = new Image();
    img.onload = async function() {
      const maxDim = 1200; // تصغير الجودة لضمان سرعة الرفع وعدم انهيار السيرفر
      let w = img.width, h = img.height;
      if (w > maxDim || h > maxDim) {
        if (w > h) { h = Math.round((h * maxDim) / w); w = maxDim; } 
        else { w = Math.round((w * maxDim) / h); h = maxDim; }
      }
      const canvas = document.createElement("canvas");
      canvas.width = w; canvas.height = h;
      const ctx = canvas.getContext("2d");
      ctx.drawImage(img, 0, 0, w, h);
      const base64 = canvas.toDataURL("image/jpeg", 0.7);

      document.getElementById("bgUploadStatus").innerText = "جاري رفع الخلفية إلى السيرفر...";
      try {
        const response = await fetch(APP_URL, { method: "POST", headers: { "Content-Type": "text/plain;charset=utf-8" }, body: JSON.stringify({ action: "updateWallBackground", imageUrl: base64, pin: ADMIN_PIN }) });
        const result = await response.json();
        if(result.success) document.getElementById("bgUploadStatus").innerText = "تم تحديث خلفية الجدار بنجاح! ✅";
        else document.getElementById("bgUploadStatus").innerText = result.message || "فشل رفع الخلفية";
      } catch(err) { document.getElementById("bgUploadStatus").innerText = "خطأ في الاتصال"; }
    };
    img.src = e.target.result;
  };
  reader.readAsDataURL(file);
}

function escapeHtml(value){ return String(value ?? "").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;").replace(/'/g,"&#039;"); }
function escapeJs(value){ return String(value ?? "").replace(/\\/g,"\\\\").replace(/'/g,"\\'"); }
</script>
