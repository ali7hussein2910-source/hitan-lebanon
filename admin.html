<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>حيطان لبنان — لوحة التحكم</title>
<style>
:root{--bg:#f5f7fb;--card:#fff;--text:#111827;--muted:#6b7280;--line:#e5e7eb;--dark:#111827;--green:#16a34a;--yellow:#d97706;--red:#dc2626;--blue:#2563eb;}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:Arial,Tahoma,sans-serif}.hidden{display:none!important}
button,input{font:inherit}button{cursor:pointer;border:0}.shell{min-height:100vh}.top{position:sticky;top:0;z-index:10;background:rgba(255,255,255,.92);backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.topin{max-width:1250px;margin:auto;padding:16px 20px;display:flex;align-items:center;justify-content:space-between;gap:15px}.brand h1{margin:0;font-size:22px}.brand p{margin:4px 0 0;color:var(--muted);font-size:12px}.logout{background:#f3f4f6;padding:9px 13px;border-radius:10px;font-weight:700}
main{max-width:1250px;margin:auto;padding:24px 20px 50px}.login{min-height:100vh;display:grid;place-items:center;padding:20px}.loginbox{width:min(420px,100%);background:var(--card);border:1px solid var(--line);border-radius:24px;padding:28px;box-shadow:0 18px 60px rgba(15,23,42,.08)}.loginbox h2{margin:0 0 8px}.loginbox p{color:var(--muted);font-size:13px}.input{width:100%;padding:13px;border:1px solid var(--line);border-radius:12px;outline:0}.input:focus{border-color:var(--blue)}.primary{background:var(--dark);color:white;padding:12px 16px;border-radius:12px;font-weight:800}.full{width:100%;margin-top:12px}.msg{min-height:22px;margin-top:10px;font-size:13px;color:var(--red)}
.stats{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;margin-bottom:20px}.stat{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px}.stat small{color:var(--muted);font-size:12px}.stat strong{display:block;font-size:25px;margin-top:7px}.toolbar{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:15px;display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:18px;flex-wrap:wrap}.tabs{display:flex;gap:7px;flex-wrap:wrap}.tab{padding:9px 13px;background:#f3f4f6;border-radius:10px;font-weight:700;color:#374151}.tab.active{background:var(--dark);color:white}.danger{background:#fee2e2;color:#991b1b;padding:10px 13px;border-radius:10px;font-weight:800}.tools{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.upload{position:relative;overflow:hidden;background:#eef2ff;color:#3730a3;padding:10px 13px;border-radius:10px;font-weight:800}.upload input{position:absolute;inset:0;opacity:0;cursor:pointer}.status{font-size:12px;color:var(--muted)}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.order{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:17px;box-shadow:0 6px 20px rgba(15,23,42,.04)}.orderhead{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}.id{font-size:12px;color:var(--muted);font-family:monospace}.badge{padding:5px 9px;border-radius:999px;font-size:11px;font-weight:800}.b-active{background:#dcfce7;color:#166534}.b-pending{background:#fef3c7;color:#92400e}.b-rejected,.b-deleted,.b-expired{background:#fee2e2;color:#991b1b}.details{display:grid;grid-template-columns:repeat(2,1fr);gap:9px}.detail{background:#f8fafc;border-radius:10px;padding:9px;font-size:13px}.detail b{display:block;font-size:10px;color:var(--muted);margin-bottom:3px}.adtext{background:#f8fafc;border-radius:10px;padding:10px;margin-top:10px;font-size:13px;white-space:pre-wrap}.logo{max-width:130px;max-height:80px;object-fit:contain;margin:12px 0;border-radius:10px;border:1px solid var(--line)}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}.approve,.reject,.delete{padding:10px 12px;border-radius:10px;font-weight:800}.approve{background:#dcfce7;color:#166534}.reject{background:#fef3c7;color:#92400e}.delete{background:#fee2e2;color:#991b1b}.empty{grid-column:1/-1;text-align:center;background:var(--card);border:1px dashed #cbd5e1;border-radius:18px;padding:45px;color:var(--muted)}
@media(max-width:900px){.stats{grid-template-columns:repeat(3,1fr)}.grid{grid-template-columns:1fr}}@media(max-width:600px){main{padding:15px 12px 35px}.topin{padding:13px 12px}.stats{grid-template-columns:repeat(2,1fr)}.stat strong{font-size:21px}.details{grid-template-columns:1fr}.toolbar{align-items:stretch}.tools{width:100%}.upload,.danger{flex:1;text-align:center}}
</style>
</head>
<body>
<div id="loginView" class="login"><div class="loginbox"><h2>حيطان لبنان</h2><p>لوحة التحكم الإدارية — أدخل رمز الإدارة للمتابعة.</p><input id="pin" class="input" type="password" inputmode="numeric" placeholder="رمز الإدارة"><button class="primary full" onclick="login()">دخول إلى لوحة التحكم</button><div id="loginMessage" class="msg"></div></div></div>
<div id="dashboard" class="shell hidden">
<header class="top"><div class="topin"><div class="brand"><h1>حيطان لبنان</h1><p>إدارة الإعلانات والمساحات والحائط</p></div><button class="logout" onclick="logout()">تسجيل الخروج</button></div></header>
<main>
<section class="stats">
<div class="stat"><small>طلبات بانتظار الدفع</small><strong id="pending">0</strong></div><div class="stat"><small>إعلانات منشورة</small><strong id="activeOrders">0</strong></div><div class="stat"><small>مساحات متاحة</small><strong id="available">0</strong></div><div class="stat"><small>مساحات محجوزة</small><strong id="reserved">0</strong></div><div class="stat"><small>إيرادات الإعلانات</small><strong id="revenue">$0</strong></div>
</section>
<section class="toolbar">
<div class="tabs"><button class="tab active" data-filter="all">الكل</button><button class="tab" data-filter="Pending">بانتظار الدفع</button><button class="tab" data-filter="Active">منشور</button><button class="tab" data-filter="Rejected">مرفوض</button><button class="tab" data-filter="Deleted">محذوف</button></div>
<div class="tools"><label class="upload">🖼️ تغيير صورة الجدار<input id="wallBgFile" type="file" accept="image/*"></label><span id="bgUploadStatus" class="status">الصورة تُضغط تلقائياً قبل الرفع</span><button class="danger" onclick="deleteAllAdsPrompt()">🗑️ تفريغ كل المساحات</button></div>
</section>
<section id="orders" class="grid"></section>
</main></div>
<script>
const APP_URL="https://script.google.com/macros/s/AKfycbzyM_gJsIV-icWDh_sy95KhPqsQpeLlS6eyl__O2zVs1aZyQf-Bp5ja_FrhW9icSHuY/exec";let ADMIN_PIN="",ALL_ORDERS=[],FILTER="all";
function escapeHtml(v){return String(v??"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;").replace(/'/g,"&#039;")}function escapeJs(v){return String(v??"").replace(/\\/g,"\\\\").replace(/'/g,"\\'")}
function login(){const pin=document.getElementById("pin").value.trim();if(!pin)return;ADMIN_PIN=pin;loadDashboard()}function logout(){ADMIN_PIN="";document.getElementById("dashboard").classList.add("hidden");document.getElementById("loginView").classList.remove("hidden");document.getElementById("pin").value=""}
async function loadDashboard(){try{const r=await fetch(APP_URL+"?action=adminStats&pin="+encodeURIComponent(ADMIN_PIN),{cache:"no-store"}),s=await r.json();if(!s.success){document.getElementById("loginMessage").textContent=s.message||"رمز الدخول غير صحيح";return}document.getElementById("loginView").classList.add("hidden");document.getElementById("dashboard").classList.remove("hidden");updateStats(s);await loadOrders()}catch(e){alert("تعذر الاتصال بالسيرفر.")}}
function updateStats(s){["pending","activeOrders","available","reserved"].forEach(k=>document.getElementById(k).textContent=s[k]??0);document.getElementById("revenue").textContent="$"+(Number(s.revenue)||0)}
async function loadOrders(){const r=await fetch(APP_URL+"?action=adminOrders&pin="+encodeURIComponent(ADMIN_PIN),{cache:"no-store"}),d=await r.json();if(!d.success){alert(d.message);return}ALL_ORDERS=d.orders||[];renderOrders()}
function badge(status){const c=status==="Active"?"b-active":status==="Pending"?"b-pending":status==="Rejected"?"b-rejected":status==="Deleted"?"b-deleted":"b-expired";return `<span class="badge ${c}">${escapeHtml(status||"Pending")}</span>`}
function renderOrders(){const box=document.getElementById("orders");const list=FILTER==="all"?ALL_ORDERS:ALL_ORDERS.filter(o=>o.orderStatus===FILTER);if(!list.length){box.innerHTML='<div class="empty">لا توجد طلبات ضمن هذا القسم.</div>';return}box.innerHTML=list.slice().reverse().map(o=>{let actions="";if(o.orderStatus==="Pending")actions+=`<button class="approve" onclick="approveOrder('${escapeJs(o.orderId)}')">✅ تأكيد الدفع والنشر</button><button class="reject" onclick="rejectOrder('${escapeJs(o.orderId)}')">❌ رفض</button>`;if(o.orderStatus!=="Deleted")actions+=`<button class="delete" onclick="deleteOrderPrompt('${escapeJs(o.orderId)}')">🗑️ حذف وتحرير المساحة</button>`;return `<article class="order"><div class="orderhead"><span class="id">${escapeHtml(o.orderId)}</span>${badge(o.orderStatus)}</div><div class="details"><div class="detail"><b>الاسم</b>${escapeHtml(o.customerName)}</div><div class="detail"><b>الهاتف</b>${escapeHtml(o.phone)}</div><div class="detail"><b>المساحة</b>${escapeHtml(o.unitType)} — ${escapeHtml(o.unitsCount)} وحدة</div><div class="detail"><b>المبلغ</b>$${escapeHtml(o.totalAmount)}</div><div class="detail"><b>الدفع</b>${escapeHtml(o.paymentStatus||"-")}</div><div class="detail"><b>مدة الإعلان</b>${escapeHtml(o.startDate||"-")} → ${escapeHtml(o.expiryDate||"-")}</div></div>${o.logo?`<img class="logo" src="${escapeHtml(o.logo)}" alt="Logo">`:""}<div class="adtext"><b>الإعلان:</b> ${escapeHtml(o.adName||"بدون اسم")}<br>${escapeHtml(o.adText||"لا يوجد نص إضافي")}</div><div class="actions">${actions}</div></article>`}).join("")}
async function post(payload){const r=await fetch(APP_URL,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify(payload)});return r.json()}
async function approveOrder(id){if(!confirm("تأكيد الدفع ونشر الإعلان؟"))return;const r=await post({action:"confirmPayment",orderId:id,pin:ADMIN_PIN});if(!r.success){alert(r.message);return}await loadDashboard()}
async function rejectOrder(id){if(!confirm("رفض الطلب وإتاحة المساحة؟"))return;const r=await post({action:"rejectOrder",orderId:id,pin:ADMIN_PIN});if(!r.success){alert(r.message);return}await loadDashboard()}
async function deleteOrderPrompt(id){if(!confirm("سيتم إلغاء الإعلان وإعادة مساحاته إلى Available. هل تريد المتابعة؟"))return;const r=await post({action:"deleteOrder",orderId:id,pin:ADMIN_PIN});if(!r.success){alert(r.message);return}await loadDashboard()}
async function deleteAllAdsPrompt(){if(!confirm("⚠️ سيتم تعطيل كل الإعلانات والطلبات وتحرير جميع المساحات. هذا الإجراء لا يمكن التراجع عنه. متابعة؟"))return;const r=await post({action:"deleteAllAds",pin:ADMIN_PIN});if(!r.success){alert(r.message);return}await loadDashboard()}
function compressImage(file,maxDim=1200,quality=.68){return new Promise((resolve,reject)=>{const reader=new FileReader();reader.onload=e=>{const img=new Image();img.onload=()=>{let w=img.width,h=img.height;if(w>maxDim||h>maxDim){if(w>h){h=Math.round(h*maxDim/w);w=maxDim}else{w=Math.round(w*maxDim/h);h=maxDim}}const c=document.createElement("canvas");c.width=w;c.height=h;c.getContext("2d").drawImage(img,0,0,w,h);resolve(c.toDataURL("image/jpeg",quality))};img.onerror=reject;img.src=e.target.result};reader.onerror=reject;reader.readAsDataURL(file)})}
document.getElementById("wallBgFile").addEventListener("change",async e=>{const f=e.target.files[0];if(!f)return;const st=document.getElementById("bgUploadStatus");try{st.textContent="جاري ضغط ورفع الصورة…";const base64=await compressImage(f);if(base64.length>4*1024*1024)throw new Error("الصورة ما زالت كبيرة. اختر صورة أصغر.");const r=await post({action:"updateWallBackground",imageUrl:base64,pin:ADMIN_PIN});st.textContent=r.success?"تم تغيير صورة الجدار بنجاح ✅":(r.message||"فشل الرفع");if(!r.success)alert(r.message)}catch(err){st.textContent=err.message||"خطأ في رفع الصورة"}});
document.querySelectorAll(".tab").forEach(b=>b.addEventListener("click",()=>{document.querySelectorAll(".tab").forEach(x=>x.classList.remove("active"));b.classList.add("active");FILTER=b.dataset.filter;renderOrders()}));
document.getElementById("pin").addEventListener("keydown",e=>{if(e.key==="Enter")login()});
</script></body></html>
