<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>لوحة تحكم حيطان لبنان</title>
<style>
  * { box-sizing: border-box; font-family: system-ui, -apple-system, sans-serif; }
  body { background: #f3f4f6; margin: 0; padding: 20px; color: #111827; }
  .container { max-width: 1000px; margin: 0 auto; }
  .box { background: white; padding: 24px; border-radius: 16px; box-shadow: 0 4px 20px rgba(0,0,0,0.06); margin-bottom: 20px; }
  h1 { font-size: 22px; margin-top: 0; }
  .input-group { margin-bottom: 15px; }
  label { display: block; font-size: 13px; font-weight: bold; margin-bottom: 6px; }
  input[type="password"], input[type="text"] { width: 100%; padding: 12px; border: 1px solid #d1d5db; border-radius: 8px; font-size: 14px; outline: none; }
  button { padding: 12px 20px; border: none; border-radius: 8px; background: #111827; color: white; font-weight: bold; cursor: pointer; transition: background 0.2s; }
  button:hover { background: #374151; }
  .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 12px; margin-top: 15px; }
  .stat-card { background: #f9fafb; padding: 16px; border-radius: 12px; border: 1px solid #e5e7eb; text-align: center; }
  .stat-num { font-size: 24px; font-weight: 800; color: #111827; margin-top: 4px; }
  .hidden { display: none !important; }
  .order { border: 1px solid #e5e7eb; border-radius: 12px; padding: 16px; margin-bottom: 12px; background: white; }
  .order-header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #f3f4f6; padding-bottom: 10px; margin-bottom: 10px; }
  .order-id { font-weight: bold; font-size: 15px; }
  .badge { padding: 4px 10px; border-radius: 20px; font-size: 12px; font-weight: bold; }
  .badge.pending { background: #fef3c7; color: #d97706; }
  .badge.active { background: #d1fae5; color: #059669; }
  .badge.rejected { background: #fee2e2; color: #dc2626; }
  .details { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 10px; font-size: 13px; }
  .detail b { display: block; color: #6b7280; font-size: 11px; }
  .actions { display: flex; gap: 8px; margin-top: 14px; flex-wrap: wrap; }
  .approve { background: #059669; } .approve:hover { background: #047857; }
  .reject { background: #dc2626; } .reject:hover { background: #b91c1c; }
  .delete-btn { background: #4b5563; } .delete-btn:hover { background: #374151; }
  img.logo { max-width: 120px; max-height: 80px; border-radius: 8px; border: 1px solid #eee; margin-top: 10px; }
</style>
</head>
<body>

<div class="container">
  
  <!-- LOGIN BOX -->
  <div class="box" id="loginBox">
    <h1>🔑 تسجيل الدخول لوحة التحكم</h1>
    <div class="input-group">
      <label>رمز الدخول (PIN)</label>
      <input type="password" id="pin" placeholder="أدخل رمز الأدمن">
    </div>
    <button onclick="login()">دخول</button>
    <div id="loginMessage" style="margin-top:10px;"></div>
  </div>

  <!-- DASHBOARD -->
  <div id="dashboard" class="hidden">
    <div class="box">
      <div style="display:flex; justify-content:space-between; align-items:center;">
        <h1>لوحة إحصائيات الحائط</h1>
        <button onclick="loadDashboard()" style="padding:8px 14px; font-size:12px;">🔄 تحديث</button>
      </div>
      <div class="stats-grid">
        <div class="stat-card"><div>طلبات معلقة</div><div class="stat-num" id="pending">0</div></div>
        <div class="stat-card"><div>إعلانات نشطة</div><div class="stat-num" id="activeOrders">0</div></div>
        <div class="stat-card"><div>المساحات المتاحة</div><div class="stat-num" id="available">0</div></div>
        <div class="stat-card"><div>مساحات بحجز موقت</div><div class="stat-num" id="reserved">0</div></div>
        <div class="stat-card"><div>وحدات نشطة</div><div class="stat-num" id="activeUnits">0</div></div>
        <div class="stat-card"><div>إجمالي الإيرادات</div><div class="stat-num" id="revenue">$0</div></div>
      </div>
    </div>

    <!-- UPDATE BACKGROUND BOX -->
    <div class="box">
      <h3>🖼️ تغيير خلفية الحائط</h3>
      <div class="input-group">
        <label>صورة الخلفية الجديدة</label>
        <input type="file" id="bgFile" accept="image/*">
      </div>
      <button onclick="uploadBackground()">رفع الخلفية الجديدة</button>
    </div>

    <!-- ORDERS LIST -->
    <div class="box">
      <h3>📋 قائمة الطلبات والإعلانات</h3>
      <div id="orders">جاري تحميل الطلبات...</div>
    </div>
  </div>

</div>

<script>
const APP_URL = "https://script.google.com/macros/s/AKfycbzyM_gJsIV-icWDh_sy95KhPqsQpeLlS6eyl__O2zVs1aZyQf-Bp5ja_FrhW9icSHuY/exec";
let ADMIN_PIN = "";

function escapeHtml(str) {
  if (!str) return "";
  return String(str).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
}

function escapeJs(str) {
  if (!str) return "";
  return String(str).replace(/'/g, "\\'");
}

function login(){
  const pin = document.getElementById("pin").value.trim();
  if(!pin) return;
  ADMIN_PIN = pin; loadDashboard();
}

async function loadDashboard(){
  try{
    const statsResponse = await fetch(APP_URL + "?action=adminStats&pin=" + encodeURIComponent(ADMIN_PIN));
    const stats = await statsResponse.json();
    if(!stats.success){
      document.getElementById("loginMessage").innerHTML = `<span style="color:#dc2626">${escapeHtml(stats.message || "رمز الدخول غير صحيح")}</span>`;
      return;
    }
    document.getElementById("loginBox").classList.add("hidden");
    document.getElementById("dashboard").classList.remove("hidden");
    document.getElementById("pending").innerText = stats.pending;
    document.getElementById("activeOrders").innerText = stats.activeOrders;
    document.getElementById("available").innerText = stats.available;
    document.getElementById("reserved").innerText = stats.reserved;
    document.getElementById("activeUnits").innerText = stats.active;
    document.getElementById("revenue").innerText = "$" + stats.revenue;
    await loadOrders();
  }catch(error){ alert("تعذر الاتصال بالسيرفر."); }
}

async function loadOrders(){
  const response = await fetch(APP_URL + "?action=adminOrders&pin=" + encodeURIComponent(ADMIN_PIN));
  const data = await response.json();
  if(!data.success){ alert(data.message); return; }
  renderOrders(data.orders);
}

function renderOrders(orders){
  const container = document.getElementById("orders");
  container.innerHTML = "";
  if(!orders.length){
    container.innerHTML = "<p style='color:#6b7280; text-align:center; padding:30px;'>لا توجد طلبات حالياً.</p>"; return;
  }
  orders.reverse().forEach(order => {
    const div = document.createElement("div"); div.className = "order";
    let statusClass = order.orderStatus === "Active" ? "active" : (order.orderStatus === "Rejected" ? "rejected" : "pending");
    let logo = order.logo ? `<img class="logo" src="${escapeHtml(order.logo)}" alt="Logo">` : "";
    let actions = "";
    if(order.orderStatus === "Pending"){
      actions = `<button class="approve" onclick="approveOrder('${escapeJs(order.orderId)}')">✅ تأكيد الدفع ونشر الإعلان</button>
                 <button class="reject" onclick="rejectOrder('${escapeJs(order.orderId)}')">❌ رفض الطلب</button>`;
    }
    actions += `<button class="delete-btn" onclick="deleteOrderPrompt('${escapeJs(order.orderId)}')">🗑️ حذف الإعلان وإتاحة المساحة</button>`;
    div.innerHTML = `
      <div class="order-header">
        <div class="order-id">رقم الطلب: ${escapeHtml(order.orderId)}</div>
        <div class="badge ${statusClass}">${escapeHtml(order.orderStatus || "Pending")}</div>
      </div>
      <div class="details">
        <div class="detail"><b>الاسم</b>${escapeHtml(order.customerName)}</div>
        <div class="detail"><b>الهاتف</b>${escapeHtml(order.phone)}</div>
        <div class="detail"><b>نوع المساحة</b>${escapeHtml(order.unitType)}</div>
        <div class="detail"><b>عدد الوحدات</b>${escapeHtml(order.unitsCount)}</div>
        <div class="detail"><b>المبلغ</b>$${escapeHtml(order.totalAmount)}</div>
        <div class="detail"><b>حالة الدفع</b>${escapeHtml(order.paymentStatus)}</div>
        <div class="detail"><b>اسم الإعلان</b>${escapeHtml(order.adName || "-")}</div>
        <div class="detail"><b>تنسيق النص</b>اللون: <span style="background:${escapeHtml(order.fontColor || '#111')}; color:#fff; border:1px solid #ccc; padding:2px 8px; border-radius:4px;">${escapeHtml(order.fontColor || '#111')}</span> | الخط: ${escapeHtml(order.fontFamily || 'Arial')} | الشكل: ${escapeHtml(order.fontStyle || 'normal')}</div>
      </div>
      ${logo}
      <div style="margin:10px 0; font-size:14px;"><b>النص الإضافي:</b>
        <div style="background:#f9fafb; padding:8px 12px; border-radius:8px; margin-top:4px;">${escapeHtml(order.adText || "لا يوجد")}</div>
      </div>
      <div style="display:flex; gap:15px; margin:10px 0; font-size:13px; color:#4b5563;">
        <div><b>WhatsApp:</b> ${escapeHtml(order.whatsapp || "-")}</div>
        <div><b>Instagram:</b> ${escapeHtml(order.instagram || "-")}</div>
      </div>
      <div class="actions">${actions}</div>
    `;
    container.appendChild(div);
  });
}

async function approveOrder(orderId){
  if(!confirm("هل تريد تأكيد الدفع ونشر هذا الإعلان؟")) return;
  try{
    const response = await fetch(APP_URL,{ method:"POST", headers:{"Content-Type":"text/plain;charset=utf-8"}, body:JSON.stringify({action:"confirmPayment", orderId:orderId, pin:ADMIN_PIN}) });
    const result = await response.json();
    if(!result.success){ alert(result.message); return; }
    alert("تم تأكيد الدفع ونشر الإعلان بنجاح ✅"); await loadDashboard();
  }catch(error){ alert("حدث خطأ أثناء تأكيد الدفع."); }
}

async function rejectOrder(orderId){
  if(!confirm("هل أنت متأكد من رفض هذا الطلب؟")) return;
  try{
    const response = await fetch(APP_URL,{ method:"POST", headers:{"Content-Type":"text/plain;charset=utf-8"}, body:JSON.stringify({action:"rejectOrder", orderId:orderId, pin:ADMIN_PIN}) });
    const result = await response.json();
    if(!result.success){ alert(result.message); return; }
    alert("تم رفض الطلب وإعادة المساحة إلى متاحة."); await loadDashboard();
  }catch(error){ alert("حدث خطأ أثناء رفض الطلب."); }
}

async function deleteOrderPrompt(orderId){
  if(!confirm("هل أنت متأكد من حذف هذا الإعلان؟ ستعود المساحات المرتبطة به متاحة للحجز.")) return;
  try{
    const response = await fetch(APP_URL,{ method:"POST", headers:{"Content-Type":"text/plain;charset=utf-8"}, body:JSON.stringify({action:"deleteOrder", orderId:orderId, pin:ADMIN_PIN}) });
    const result = await response.json();
    if(!result.success){ alert(result.message); return; }
    alert("تم حذف الإعلان وإتاحة المساحات."); await loadDashboard();
  }catch(error){ alert("حدث خطأ أثناء الحذف."); }
}

async function uploadBackground(){
  const fileInput = document.getElementById("bgFile");
  if(!fileInput.files.length){ alert("يرجى اختيار صورة أولاً."); return; }
  const reader = new FileReader();
  reader.onload = async function(e){
    try{
      const response = await fetch(APP_URL, { method:"POST", headers:{"Content-Type":"text/plain;charset=utf-8"}, body:JSON.stringify({action:"updateWallBackground", imageUrl:e.target.result, pin:ADMIN_PIN}) });
      const result = await response.json();
      if(!result.success){ alert(result.message); return; }
      alert("تم تحديث خلفية الحائط بنجاح 🎉");
    }catch(err){ alert("تعذر رفع الصورة."); }
  };
  reader.readAsDataURL(fileInput.files[0]);
}
</script>
</body>
</html>
