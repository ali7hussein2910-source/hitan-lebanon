<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>حيطان لبنان</title>
<style>
*{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
html,body,#app{ margin:0; width:100%; height:100%; overflow:hidden; background:#222; font-family:Arial,Tahoma,sans-serif; }
#app{ position:fixed; inset:0; }
#wallViewport{ position:absolute; inset:0; overflow:hidden; background:#555; touch-action:none; }
#wallCanvas{ position:absolute; inset:0; width:100%; height:100%; display:block; }
#brand{ position:absolute; top:14px; right:14px; z-index:20; padding:10px 14px; border-radius:14px; color:white; background:rgba(0,0,0,.48); backdrop-filter:blur(8px); pointer-events:none; }
#brand .title{ font-size:20px; font-weight:800; }
#hint{ position:absolute; top:18px; left:50%; transform:translateX(-50%); z-index:20; padding:9px 15px; border-radius:30px; color:#fff; background:rgba(0,0,0,.48); backdrop-filter:blur(8px); font-size:13px; pointer-events:none; }
.hidden { display: none !important; }
</style>
</head>
<body>

<div id="app">
  <div id="wallViewport"><canvas id="wallCanvas"></canvas></div>
  <div id="brand"><div class="title">حيطان لبنان</div></div>
  <div id="hint">كبّر الحائط لتشوف الوحدات وتختار مطرحك</div>
</div>

<script>
const APP_URL = "https://script.google.com/macros/s/AKfycbzyM_gJsIV-icWDh_sy95KhPqsQpeLlS6eyl__O2zVs1aZyQf-Bp5ja_FrhW9icSHuY/exec";
const ROWS = 100, COLS = 100;
const canvas = document.getElementById("wallCanvas");
const ctx = canvas.getContext("2d");

let W = window.innerWidth, H = window.innerHeight;
let worldSize = 1000, cellSize = worldSize / COLS;
let zoom = 1, cameraX = 0, cameraY = 0;
let wallBgImg = null;
window.HITAN_WALL_DATA = null;
window.HITAN_UNITS = {};

function resizeCanvas(){
  W = window.innerWidth; H = window.innerHeight;
  canvas.width = W; canvas.height = H;
  worldSize = Math.max(W,H);
  cellSize = worldSize / COLS;
  draw();
}
window.addEventListener("resize", resizeCanvas);

async function loadWallData(){
  try {
    const res = await fetch(APP_URL + "?action=wall", { cache: "no-store" });
    const data = await res.json();
    if(data.success){
      window.HITAN_WALL_DATA = data;
      (data.units || []).forEach(u => window.HITAN_UNITS[u.id] = u);
      if(data.wallBackground || data.wallBackgroundUrl){
        const img = new Image();
        img.crossOrigin = "anonymous";
        img.onload = () => { wallBgImg = img; draw(); };
        img.src = data.wallBackground || data.wallBackgroundUrl;
      }
      draw();
    }
  } catch(e){}
}

function draw(){
  ctx.clearRect(0, 0, W, H);
  ctx.save();
  ctx.translate(cameraX, cameraY);
  ctx.scale(zoom, zoom);

  if (wallBgImg) ctx.drawImage(wallBgImg, 0, 0, worldSize, worldSize);
  else { ctx.fillStyle = "#444"; ctx.fillRect(0,0,worldSize,worldSize); }

  // 1. رسم لون المساحات المحجوزة لون شفاف خفيف جداً
  if (window.HITAN_UNITS) {
    for(let r=0; r<ROWS; r++){
      for(let c=0; c<COLS; c++){
        const id = "A" + String(r * COLS + c + 1).padStart(4, "0");
        const unit = window.HITAN_UNITS[id];
        if(unit && unit.status === "Reserved"){
          ctx.fillStyle = "rgba(255, 215, 0, 0.18)";
          ctx.fillRect(c * cellSize, r * cellSize, cellSize, cellSize);
        }
      }
    }
  }

  // 2. رسم مربعات الشبكة قبل الإعلانات
  if(zoom > 2.2){
    ctx.strokeStyle = "rgba(0,0,0,0.15)";
    ctx.lineWidth = 0.5;
    for(let i=0; i<=COLS; i++){
      ctx.beginPath(); ctx.moveTo(i*cellSize, 0); ctx.lineTo(i*cellSize, worldSize); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(0, i*cellSize); ctx.lineTo(worldSize, i*cellSize); ctx.stroke();
    }
  }

  // 3. رسم الإعلانات فوق الشبكة لضمان عدم ظهور المربعات على اللوغو
  if(window.HITAN_WALL_DATA && window.HITAN_WALL_DATA.ads){
    window.HITAN_WALL_DATA.ads.forEach(ad => {
      if(!ad.unitIds || !ad.unitIds.length) return;
      let minR = 1000, maxR = -1, minC = 1000, maxC = -1;
      ad.unitIds.forEach(id => {
        const u = window.HITAN_UNITS[id];
        if(u){
          minR = Math.min(minR, u.row - 1); maxR = Math.max(maxR, u.row - 1);
          minC = Math.min(minC, u.column - 1); maxC = Math.max(maxC, u.column - 1);
        }
      });
      if(minR < 1000){
        const x = minC * cellSize, y = minR * cellSize;
        const w = (maxC - minC + 1) * cellSize, h = (maxR - minR + 1) * cellSize;

        // إخفاء المربعات خلف اللوغو بخلفية بيضاء نقية
        ctx.fillStyle = "#ffffff";
        ctx.fillRect(x, y, w, h);

        if(ad.logoUrl){
          const img = new Image();
          img.onload = () => draw();
          img.src = ad.logoUrl;
          ctx.drawImage(img, x, y, w, h);
        }
        ctx.strokeStyle = "rgba(255,255,255,0.8)";
        ctx.strokeRect(x, y, w, h);
      }
    });
  }

  ctx.restore();
}

window.onload = async () => {
  resizeCanvas();
  await loadWallData();
};
</script>
</body>
</html>
