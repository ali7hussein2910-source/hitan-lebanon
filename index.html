<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>حيطان لبنان — كل اسم إلو مطرح</title>

<style>
*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html,body{
  margin:0;
  padding:0;
  width:100%;
  min-height:100%;
  font-family:Tahoma,Arial,sans-serif;
  background:#151515;
  color:#fff;
  overflow-x:hidden;
}

body{
  background:
    radial-gradient(circle at 20% 10%,rgba(255,255,255,.05),transparent 30%),
    #151515;
}

/* ================= HEADER ================= */

header{
  position:sticky;
  top:0;
  z-index:20;
  padding:14px 18px;
  background:rgba(20,20,20,.92);
  backdrop-filter:blur(12px);
  border-bottom:1px solid rgba(255,255,255,.08);
}

.header-inner{
  max-width:1200px;
  margin:auto;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:15px;
}

.logo-title{
  display:flex;
  align-items:center;
  gap:12px;
}

.logo-mark{
  width:45px;
  height:45px;
  border-radius:12px;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:24px;
  background:
    linear-gradient(135deg,#f4d35e,#c99728);
  color:#171717;
  box-shadow:0 5px 20px rgba(0,0,0,.35);
}

.project-name{
  font-size:21px;
  font-weight:800;
}

.slogan{
  font-size:12px;
  color:#aaa;
  margin-top:3px;
}

/* ================= HERO ================= */

.hero{
  max-width:1200px;
  margin:auto;
  padding:35px 18px 20px;
  text-align:center;
}

.hero h1{
  margin:0;
  font-size:clamp(28px,5vw,50px);
  font-weight:900;
  letter-spacing:-1px;
}

.hero h1 span{
  color:#f4d35e;
}

.hero p{
  color:#aaa;
  max-width:650px;
  margin:12px auto 0;
  line-height:1.8;
  font-size:15px;
}

/* ================= WALL ================= */

.wall-wrapper{
  width:100%;
  padding:10px 12px 30px;
}

.wall-container{
  position:relative;
  width:min(1200px,100%);
  height:min(72vh,760px);
  min-height:440px;
  margin:auto;
  overflow:hidden;
  border-radius:20px;
  background:#777;
  box-shadow:
    0 25px 70px rgba(0,0,0,.6),
    inset 0 0 80px rgba(0,0,0,.35);
  touch-action:none;
}

canvas{
  display:block;
  width:100%;
  height:100%;
  touch-action:none;
}

/* ================= ZOOM ================= */

.zoom-controls{
  position:absolute;
  left:14px;
  bottom:14px;
  z-index:5;
  display:flex;
  flex-direction:column;
  gap:8px;
}

.zoom-btn{
  width:46px;
  height:46px;
  border:none;
  border-radius:14px;
  background:rgba(20,20,20,.82);
  color:#fff;
  font-size:23px;
  font-weight:bold;
  cursor:pointer;
  box-shadow:0 5px 15px rgba(0,0,0,.3);
}

.zoom-btn:active{
  transform:scale(.94);
}

/* ================= WALL INFO ================= */

.wall-info{
  position:absolute;
  right:14px;
  bottom:14px;
  padding:9px 13px;
  border-radius:12px;
  background:rgba(15,15,15,.78);
  backdrop-filter:blur(8px);
  color:#ddd;
  font-size:12px;
}

/* ================= BOOKING ================= */

.booking{
  width:min(700px,calc(100% - 24px));
  margin:15px auto 50px;
  background:#202020;
  border:1px solid rgba(255,255,255,.08);
  border-radius:22px;
  padding:22px;
  box-shadow:0 20px 50px rgba(0,0,0,.35);
}

.booking h2{
  margin:0 0 18px;
  font-size:22px;
}

.field{
  margin-bottom:14px;
}

.field label{
  display:block;
  color:#bbb;
  font-size:13px;
  margin-bottom:7px;
}

input,textarea,select{
  width:100%;
  border:1px solid #3a3a3a;
  background:#151515;
  color:#fff;
  border-radius:12px;
  padding:13px;
  font-family:inherit;
  font-size:15px;
  outline:none;
}

textarea{
  min-height:90px;
  resize:vertical;
}

input:focus,
textarea:focus,
select:focus{
  border-color:#f4d35e;
}

/* ================= TYPE ================= */

.type-buttons{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
}

.type-btn{
  padding:14px;
  border-radius:13px;
  border:1px solid #444;
  background:#171717;
  color:#ddd;
  cursor:pointer;
  font-family:inherit;
}

.type-btn.active{
  background:#f4d35e;
  border-color:#f4d35e;
  color:#111;
  font-weight:bold;
}

/* ================= PRICE ================= */

.price-box{
  margin:18px 0;
  padding:16px;
  border-radius:15px;
  background:#171717;
  border:1px solid rgba(255,255,255,.07);
  display:flex;
  align-items:center;
  justify-content:space-between;
}

.price-label{
  color:#aaa;
}

.price{
  color:#f4d35e;
  font-size:25px;
  font-weight:900;
}

/* ================= BUTTON ================= */

.main-btn{
  width:100%;
  border:0;
  border-radius:14px;
  padding:16px;
  background:linear-gradient(135deg,#f4d35e,#d7a92d);
  color:#111;
  font-size:17px;
  font-weight:900;
  cursor:pointer;
  box-shadow:0 10px 25px rgba(0,0,0,.25);
}

.main-btn:active{
  transform:scale(.98);
}

/* ================= MODAL ================= */

.modal{
  position:fixed;
  inset:0;
  z-index:100;
  display:none;
  align-items:center;
  justify-content:center;
  background:rgba(0,0,0,.75);
  backdrop-filter:blur(7px);
  padding:15px;
}

.modal.show{
  display:flex;
}

.modal-card{
  width:min(600px,100%);
  max-height:92vh;
  overflow:auto;
  background:#202020;
  border:1px solid rgba(255,255,255,.1);
  border-radius:22px;
  padding:22px;
}

.modal-head{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
  margin-bottom:15px;
}

.close{
  width:40px;
  height:40px;
  border:0;
  border-radius:12px;
  background:#303030;
  color:#fff;
  font-size:22px;
  cursor:pointer;
}

/* ================= RESPONSIVE ================= */

@media(max-width:700px){

  header{
    padding:11px 13px;
  }

  .logo-mark{
    width:39px;
    height:39px;
    font-size:20px;
  }

  .project-name{
    font-size:17px;
  }

  .hero{
    padding:25px 15px 15px;
  }

  .hero h1{
    font-size:31px;
  }

  .hero p{
    font-size:13px;
  }

  .wall-wrapper{
    padding:5px 7px 20px;
  }

  .wall-container{
    height:62vh;
    min-height:390px;
    border-radius:16px;
  }

  .wall-info{
    right:9px;
    bottom:9px;
    font-size:10px;
  }

  .zoom-controls{
    left:9px;
    bottom:9px;
  }

  .zoom-btn{
    width:44px;
    height:44px;
  }

  .booking{
    padding:17px;
    border-radius:18px;
  }

  .modal{
    padding:0;
    align-items:stretch;
  }

  .modal-card{
    width:100%;
    height:100%;
    max-height:none;
    border-radius:0;
    padding:18px;
  }
}
</style>
</head>

<body>

<header>
  <div class="header-inner">
    <div class="logo-title">
      <div class="logo-mark">ح</div>

      <div>
        <div class="project-name">حيطان لبنان</div>
        <div class="slogan">كل اسم إلو مطرح</div>
      </div>
    </div>
  </div>
</header>

<section class="hero">
  <h1>اترك <span>بصمتك</span> على حيطان لبنان</h1>

  <p>
    اختار مساحتك، اكتب اسمك أو اعرض شعارك،
    وخلي إلك مطرح على الحيط.
  </p>
</section>

<div class="wall-wrapper">

  <div class="wall-container" id="wallContainer">

    <canvas id="wallCanvas"></canvas>

    <div class="zoom-controls">
      <button class="zoom-btn" id="zoomIn">+</button>
      <button class="zoom-btn" id="zoomOut">−</button>
      <button class="zoom-btn" id="resetZoom">↻</button>
    </div>

    <div class="wall-info">
      حرك الحائط واسحب للتصفح
    </div>

  </div>

</div>

<section class="booking">

  <h2>احجز مساحتك</h2>

  <div class="field">
    <label>نوع المساحة</label>

    <div class="type-buttons">

      <button
        class="type-btn active"
        data-type="Standard"
        id="standardBtn">
        Standard — $1
      </button>

      <button
        class="type-btn"
        data-type="Center"
        id="centerBtn">
        Center — $5
      </button>

    </div>
  </div>

  <div class="field">
    <label>عدد الوحدات</label>

    <input
      type="number"
      id="unitsCount"
      min="1"
      value="20"
    >
  </div>

  <div class="price-box">

    <div class="price-label">
      السعر الإجمالي
    </div>

    <div class="price" id="totalPrice">
      $20
    </div>

  </div>

  <button class="main-btn" id="previewBtn">
    معاينة المساحة
  </button>

</section>


<div class="modal" id="adModal">

  <div class="modal-card">

    <div class="modal-head">

      <h2>تفاصيل إعلانك</h2>

      <button
        class="close"
        id="closeModal">
        ×
      </button>

    </div>

    <div class="field">
      <label>رابط الشعار — اختياري</label>
      <input id="logoUrl" placeholder="https://...">
    </div>

    <div class="field">
      <label>الاسم — اختياري</label>
      <input id="adName" placeholder="اسمك أو اسم المؤسسة">
    </div>

    <div class="field">
      <label>النص الإضافي — اختياري</label>
      <textarea id="adText" placeholder="اكتب رسالتك..."></textarea>
    </div>

    <div class="field">
      <label>رقم الهاتف — اختياري</label>
      <input id="adPhone">
    </div>

    <div class="field">
      <label>WhatsApp — اختياري</label>
      <input id="adWhatsapp">
    </div>

    <div class="field">
      <label>Instagram — اختياري</label>
      <input id="adInstagram">
    </div>

    <button class="main-btn" id="confirmPreview">
      تأكيد ومتابعة
    </button>

  </div>

</div>


<script>

/* =====================================================
   APPS SCRIPT
===================================================== */

const APP_URL =
"https://script.google.com/macros/s/AKfycbzyM_gJsIV-icWDh_sy95KhPqsQpeLlS6eyl__O2zVs1aZyQf-Bp5ja_FrhW9icSHuY/exec";


/* =====================================================
   CANVAS
===================================================== */

const canvas =
document.getElementById("wallCanvas");

const ctx =
canvas.getContext("2d");

const container =
document.getElementById("wallContainer");


let selectedType = "Standard";

let selectedUnits = [];

let zoom = 1;

let offsetX = 0;
let offsetY = 0;

let dragging = false;

let lastX = 0;
let lastY = 0;

let pinchStart = null;


/* =====================================================
   WALL SIZE
===================================================== */

const GRID = 100;


/* =====================================================
   RESIZE
===================================================== */

function resizeCanvas(){

  const rect =
    container.getBoundingClientRect();

  const dpr =
    window.devicePixelRatio || 1;

  canvas.width =
    rect.width * dpr;

  canvas.height =
    rect.height * dpr;

  canvas.style.width =
    rect.width + "px";

  canvas.style.height =
    rect.height + "px";

  ctx.setTransform(
    dpr,0,0,dpr,0,0
  );

  drawWall();
}

window.addEventListener(
  "resize",
  resizeCanvas
);


/* =====================================================
   TEXTURE HELPERS
===================================================== */

function noise(x,y){

  const n =
    Math.sin(x * 12.9898 + y * 78.233) *
    43758.5453;

  return n - Math.floor(n);
}


/* =====================================================
   DRAW WALL BACKGROUND
===================================================== */

function drawConcrete(){

  const w =
    canvas.clientWidth;

  const h =
    canvas.clientHeight;

  const gradient =
    ctx.createLinearGradient(
      0,0,w,h
    );

  gradient.addColorStop(
    0,
    "#96928b"
  );

  gradient.addColorStop(
    .35,
    "#77746e"
  );

  gradient.addColorStop(
    .7,
    "#85817a"
  );

  gradient.addColorStop(
    1,
    "#5f5c57"
  );

  ctx.fillStyle =
    gradient;

  ctx.fillRect(
    0,0,w,h
  );


  /* Concrete noise */

  for(let i=0;i<9000;i++){

    const x =
      Math.random()*w;

    const y =
      Math.random()*h;

    const r =
      Math.random()*1.8;

    const alpha =
      Math.random()*.10;

    ctx.fillStyle =
      `rgba(20,20,20,${alpha})`;

    ctx.beginPath();

    ctx.arc(
      x,
      y,
      r,
      0,
      Math.PI*2
    );

    ctx.fill();
  }


  /* Vertical concrete stains */

  for(let i=0;i<18;i++){

    const x =
      Math.random()*w;

    const width =
      10 + Math.random()*45;

    const g =
      ctx.createLinearGradient(
        x,0,
        x+width,0
      );

    g.addColorStop(
      0,
      "rgba(0,0,0,0)"
    );

    g.addColorStop(
      .5,
      "rgba(20,20,20,.08)"
    );

    g.addColorStop(
      1,
      "rgba(0,0,0,0)"
    );

    ctx.fillStyle = g;

    ctx.fillRect(
      x,
      0,
      width,
      h
    );
  }
}


/* =====================================================
   CRACKS
===================================================== */

function drawCrack(
  startX,
  startY,
  length,
  angle
){

  ctx.save();

  ctx.translate(
    startX,
    startY
  );

  ctx.rotate(angle);

  ctx.strokeStyle =
    "rgba(25,25,25,.38)";

  ctx.lineWidth = 1.3;

  ctx.beginPath();

  ctx.moveTo(0,0);

  let x=0;
  let y=0;

  for(let i=0;i<length;i+=10){

    x += 10;

    y +=
      (Math.random()-.5)*8;

    ctx.lineTo(
      x,
      y
    );

    if(Math.random()<.22){

      ctx.moveTo(
        x,
        y
      );

      ctx.lineTo(
        x+Math.random()*25,
        y+(Math.random()-.5)*20
      );

      ctx.moveTo(
        x,
        y
      );
    }

  }

  ctx.stroke();

  ctx.restore();
}


/* =====================================================
   GRAFFITI
===================================================== */

function drawGraffiti(){

  const w =
    canvas.clientWidth;

  const h =
    canvas.clientHeight;

  ctx.save();

  ctx.globalAlpha=.22;

  ctx.font =
    "900 48px Arial";

  ctx.rotate(-.08);

  ctx.fillStyle =
    "#202020";

  ctx.fillText(
    "LEBANON",
    w*.07,
    h*.25
  );

  ctx.globalAlpha=.14;

  ctx.font =
    "900 38px Arial";

  ctx.fillStyle =
    "#7c2525";

  ctx.fillText(
    "بيروت",
    w*.72,
    h*.78
  );

  ctx.restore();
}


/* =====================================================
   POSTERS
===================================================== */

function drawPoster(
  x,
  y,
  width,
  height,
  rotation,
  title
){

  ctx.save();

  ctx.translate(
    x,
    y
  );

  ctx.rotate(rotation);

  /* shadow */

  ctx.fillStyle =
    "rgba(0,0,0,.25)";

  ctx.fillRect(
    5,
    6,
    width,
    height
  );

  /* paper */

  const paper =
    ctx.createLinearGradient(
      0,0,
      width,height
    );

  paper.addColorStop(
    0,
    "#e8e0cf"
  );

  paper.addColorStop(
    1,
    "#bdb5a4"
  );

  ctx.fillStyle =
    paper;

  ctx.fillRect(
    0,
    0,
    width,
    height
  );

  ctx.strokeStyle =
    "rgba(30,30,30,.3)";

  ctx.strokeRect(
    0,
    0,
    width,
    height
  );

  ctx.fillStyle =
    "#333";

  ctx.font =
    "bold 13px Arial";

  ctx.fillText(
    title,
    7,
    20
  );

  ctx.fillStyle =
    "#777";

  ctx.font =
    "10px Arial";

  ctx.fillText(
    "كل اسم إلو مطرح",
    7,
    38
  );

  ctx.restore();
}


/* =====================================================
   CENTER REGION
===================================================== */

function drawCenterRegion(){

  const w =
    canvas.clientWidth;

  const h =
    canvas.clientHeight;

  const size =
    Math.min(w,h)*.42;

  const x =
    w/2-size/2;

  const y =
    h/2-size/2;


  /* soft gold glow */

  const glow =
    ctx.createRadialGradient(
      w/2,
      h/2,
      size*.2,
      w/2,
      h/2,
      size*.8
    );

  glow.addColorStop(
    0,
    "rgba(244,211,94,.10)"
  );

  glow.addColorStop(
    1,
    "rgba(244,211,94,0)"
  );

  ctx.fillStyle =
    glow;

  ctx.fillRect(
    x-size*.35,
    y-size*.35,
    size*1.7,
    size*1.7
  );


  /* subtle border */

  ctx.strokeStyle =
    "rgba(244,211,94,.32)";

  ctx.lineWidth=2;

  ctx.setLineDash([
    7,
    9
  ]);

  ctx.strokeRect(
    x,
    y,
    size,
    size
  );

  ctx.setLineDash([]);


  /* small corner marks */

  const mark=16;

  ctx.strokeStyle =
    "rgba(244,211,94,.65)";

  ctx.lineWidth=2;

  const corners=[
    [x,y,1,1],
    [x+size,y,-1,1],
    [x,y+size,1,-1],
    [x+size,y+size,-1,-1]
  ];

  corners.forEach(c=>{

    ctx.beginPath();

    ctx.moveTo(
      c[0],
      c[1]
    );

    ctx.lineTo(
      c[0]+c[2]*mark,
      c[1]
    );

    ctx.moveTo(
      c[0],
      c[1]
    );

    ctx.lineTo(
      c[0],
      c[1]+c[3]*mark
    );

    ctx.stroke();

  });
}


/* =====================================================
   SELECTED UNITS
===================================================== */

function drawSelectedUnits(){

  if(!selectedUnits.length)
    return;

  const w =
    canvas.clientWidth;

  const h =
    canvas.clientHeight;

  const base =
    Math.min(w,h);

  const cell =
    base / 100;

  /*
    Selected area is intentionally
    highlighted only while previewing.
  */

  ctx.save();

  selectedUnits.forEach((id,index)=>{

    const num =
      parseInt(
        id.replace(/\D/g,""),
        10
      )-1;

    const row =
      Math.floor(num/100);

    const col =
      num%100;

    const x =
      col*cell;

    const y =
      row*cell;

    ctx.fillStyle =
      "rgba(92,214,126,.72)";

    ctx.fillRect(
      x,
      y,
      cell+.5,
      cell+.5
    );

  });

  ctx.restore();
}


/* =====================================================
   MAIN DRAW
===================================================== */

function drawWall(){

  const w =
    canvas.clientWidth;

  const h =
    canvas.clientHeight;

  if(!w || !h)
    return;


  ctx.clearRect(
    0,
    0,
    w,
    h
  );


  ctx.save();


  /*
    The wall itself is larger than
    the visible area when zoomed.
  */

  ctx.translate(
    w/2 + offsetX,
    h/2 + offsetY
  );

  ctx.scale(
    zoom,
    zoom
  );

  ctx.translate(
    -w/2,
    -h/2
  );


  drawConcrete();


  /* cracks */

  drawCrack(
    w*.18,
    h*.10,
    150,
    .35
  );

  drawCrack(
    w*.74,
    h*.18,
    120,
    2.7
  );

  drawCrack(
    w*.63,
    h*.70,
    160,
    -.3
  );

  drawCrack(
    w*.22,
    h*.76,
    100,
    2.5
  );


  /* posters */

  drawPoster(
    w*.08,
    h*.53,
    85,
    105,
    -.08,
    "BEIRUT"
  );

  drawPoster(
    w*.78,
    h*.31,
    95,
    120,
    .06,
    "LEBANON"
  );

  drawPoster(
    w*.52,
    h*.08,
    75,
    95,
    -.04,
    "2026"
  );


  drawGraffiti();


  drawCenterRegion();


  /*
    IMPORTANT:
    No permanent visible grid.
    Grid only appears while zooming deeply.
  */

  if(zoom >= 2.5){

    const cell =
      Math.min(w,h)/100;

    ctx.strokeStyle =
      "rgba(255,255,255,.08)";

    ctx.lineWidth=.5;

    for(let i=0;i<=100;i++){

      ctx.beginPath();

      ctx.moveTo(
        i*cell,
        0
      );

      ctx.lineTo(
        i*cell,
        h
      );

      ctx.stroke();

      ctx.beginPath();

      ctx.moveTo(
        0,
        i*cell
      );

      ctx.lineTo(
        w,
        i*cell
      );

      ctx.stroke();
    }

  }


  drawSelectedUnits();


  ctx.restore();
}


/* =====================================================
   TYPE SELECTION
===================================================== */

document.querySelectorAll(".type-btn")
.forEach(btn=>{

  btn.addEventListener(
    "click",
    ()=>{

      document.querySelectorAll(".type-btn")
      .forEach(b=>
        b.classList.remove("active")
      );

      btn.classList.add("active");

      selectedType =
        btn.dataset.type;

      updatePrice();

      selectedUnits=[];

      drawWall();

    }
  );

});


/* =====================================================
   PRICE
===================================================== */

function updatePrice(){

  const count =
    Number(
      document.getElementById(
        "unitsCount"
      ).value
    ) || 0;

  const price =
    selectedType === "Center"
      ? count*5
      : count;

  document.getElementById(
    "totalPrice"
  ).textContent =
    "$"+price;
}

document.getElementById(
  "unitsCount"
).addEventListener(
  "input",
  updatePrice
);


/* =====================================================
   PREVIEW
===================================================== */

document.getElementById(
  "previewBtn"
).addEventListener(
  "click",
  previewArea
);


async function previewArea(){

  const count =
    Number(
      document.getElementById(
        "unitsCount"
      ).value
    );


  if(!count || count<1){

    alert(
      "أدخل عدد الوحدات."
    );

    return;
  }


  const button =
    document.getElementById(
      "previewBtn"
    );

  button.disabled=true;

  button.textContent=
    "جاري البحث عن مساحة...";


  try{

    const response =
      await fetch(
        APP_URL,
        {
          method:"POST",

          headers:{
            "Content-Type":
              "text/plain;charset=utf-8"
          },

          body:JSON.stringify({

            action:"preview",

            unitType:
              selectedType,

            unitsCount:
              count

          })
        }
      );


    const data =
      await response.json();


    if(!data.success){

      alert(
        data.message ||
        "لم نتمكن من إيجاد مساحة."
      );

      return;
    }


    selectedUnits =
      data.unitIds || [];


    drawWall();


    document.getElementById(
      "adModal"
    ).classList.add("show");


  }catch(error){

    console.error(error);

    alert(
      "حدث خطأ في الاتصال."
    );

  }finally{

    button.disabled=false;

    button.textContent=
      "معاينة المساحة";

  }

}


/* =====================================================
   MODAL
===================================================== */

document.getElementById(
  "closeModal"
).addEventListener(
  "click",
  ()=>{
    document.getElementById(
      "adModal"
    ).classList.remove("show");
  }
);


/*
  This button is intentionally kept
  as a placeholder for the next step.
  We will connect it to createOrder
  without changing the wall.
*/

document.getElementById(
  "confirmPreview"
).addEventListener(
  "click",
  ()=>{

    alert(
      "تم تجهيز المساحة. سنكمل ربط بيانات الإعلان والدفع في الخطوة التالية."
    );

  }
);


/* =====================================================
   ZOOM
===================================================== */

function zoomAt(
  newZoom,
  centerX,
  centerY
){

  newZoom =
    Math.max(
      .7,
      Math.min(
        5,
        newZoom
      )
    );


  const rect =
    canvas.getBoundingClientRect();

  const x =
    centerX -
    rect.width/2;

  const y =
    centerY -
    rect.height/2;


  const scale =
    newZoom/zoom;


  offsetX =
    x -
    (x-offsetX)*scale;

  offsetY =
    y -
    (y-offsetY)*scale;

  zoom =
    newZoom;

  drawWall();
}


document.getElementById(
  "zoomIn"
).addEventListener(
  "click",
  ()=>{

    zoomAt(
      zoom*1.25,
      canvas.clientWidth/2,
      canvas.clientHeight/2
    );

  }
);


document.getElementById(
  "zoomOut"
).addEventListener(
  "click",
  ()=>{

    zoomAt(
      zoom/1.25,
      canvas.clientWidth/2,
      canvas.clientHeight/2
    );

  }
);


document.getElementById(
  "resetZoom"
).addEventListener(
  "click",
  ()=>{

    zoom=1;

    offsetX=0;
    offsetY=0;

    drawWall();

  }
);


/* =====================================================
   MOUSE DRAG
===================================================== */

canvas.addEventListener(
  "mousedown",
  e=>{

    dragging=true;

    lastX=e.clientX;
    lastY=e.clientY;

  }
);

window.addEventListener(
  "mouseup",
  ()=>{
    dragging=false;
  }
);

window.addEventListener(
  "mousemove",
  e=>{

    if(!dragging)
      return;

    offsetX +=
      e.clientX-lastX;

    offsetY +=
      e.clientY-lastY;

    lastX=e.clientX;
    lastY=e.clientY;

    drawWall();

  }
);


/* =====================================================
   MOUSE WHEEL
===================================================== */

canvas.addEventListener(
  "wheel",
  e=>{

    e.preventDefault();

    const factor =
      e.deltaY<0
        ? 1.12
        : .89;

    zoomAt(
      zoom*factor,
      e.clientX-
        canvas.getBoundingClientRect().left,
      e.clientY-
        canvas.getBoundingClientRect().top
    );

  },
  {passive:false}
);


/* =====================================================
   TOUCH
===================================================== */

canvas.addEventListener(
  "touchstart",
  e=>{

    if(e.touches.length===1){

      dragging=true;

      lastX=
        e.touches[0].clientX;

      lastY=
        e.touches[0].clientY;

    }

    if(e.touches.length===2){

      dragging=false;

      pinchStart =
        Math.hypot(
          e.touches[0].clientX -
          e.touches[1].clientX,

          e.touches[0].clientY -
          e.touches[1].clientY
        );

    }

  },
  {passive:false}
);


canvas.addEventListener(
  "touchmove",
  e=>{

    e.preventDefault();


    if(
      e.touches.length===1 &&
      dragging
    ){

      const x =
        e.touches[0].clientX;

      const y =
        e.touches[0].clientY;


      offsetX +=
        x-lastX;

      offsetY +=
        y-lastY;


      lastX=x;
      lastY=y;


      drawWall();

    }


    if(
      e.touches.length===2 &&
      pinchStart
    ){

      const distance =
        Math.hypot(
          e.touches[0].clientX -
          e.touches[1].clientX,

          e.touches[0].clientY -
          e.touches[1].clientY
        );


      const factor =
        distance/pinchStart;


      zoom =
        Math.max(
          .7,
          Math.min(
            5,
            zoom*factor
          )
        );


      pinchStart=distance;

      drawWall();

    }

  },
  {passive:false}
);


canvas.addEventListener(
  "touchend",
  e=>{

    if(e.touches.length===0){

      dragging=false;

      pinchStart=null;

    }

  }
);


/* =====================================================
   START
===================================================== */

resizeCanvas();

updatePrice();

</script>
