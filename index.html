<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>حيطان لبنان — كل اسم إلو مطرح</title>
<style>
*{
  box-sizing:border-box;
}
body{
  margin:0;
  font-family:Arial,Tahoma,sans-serif;
  background:#111;
  color:white;
  overflow-x:hidden;
}
header{
  position:sticky;
  top:0;
  z-index:20;
  background:rgba(15,15,15,.95);
  padding:14px 18px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
  border-bottom:1px solid #333;
}
.logoTitle{
  font-size:22px;
  font-weight:bold;
}
.slogan{
  color:#aaa;
  font-size:13px;
  margin-top:3px;
}
button{
  border:0;
  border-radius:12px;
  padding:12px 18px;
  font-size:15px;
  font-weight:bold;
  cursor:pointer;
}
.mainBtn{
  background:#fff;
  color:#111;
}
.wallArea{
  padding:18px;
  overflow:hidden;
}
.wallViewport{
  width:100%;
  height:70vh;
  min-height:430px;
  overflow:hidden;
  border-radius:18px;
  border:1px solid #444;
  background:#222;
  cursor:grab;
  position:relative;
  touch-action:none;
}
.wallViewport:active{
  cursor:grabbing;
}
.wall{
  position:absolute;
  width:1800px;
  height:1200px;
  background:
    radial-gradient(circle at 20% 30%,rgba(255,255,255,.08),transparent 25%),
    radial-gradient(circle at 70% 70%,rgba(255,255,255,.05),transparent 25%),
    linear-gradient(135deg,#777,#4e4e4e 45%,#666);
  transform-origin:0 0;
}
.graffiti{
  position:absolute;
  font-weight:900;
  opacity:.16;
  transform:rotate(-8deg);
  user-select:none;
}
.g1{left:100px;top:100px;font-size:100px;}
.g2{left:1100px;top:120px;font-size:90px;transform:rotate(7deg);}
.g3{left:200px;top:850px;font-size:80px;transform:rotate(5deg);}
.g4{left:1250px;top:850px;font-size:90px;transform:rotate(-5deg);}
.centerZone{
  position:absolute;
  left:40%;
  top:33.333%;
  width:20%;
  height:33.333%;
  border:4px dashed rgba(255,215,0,.8);
  background:rgba(255,215,0,.06);
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:42px;
  font-weight:bold;
  color:rgba(255,215,0,.7);
}
.unitPreview{
  position:absolute;
  background:rgba(0,200,80,.65);
  border:1px solid rgba(255,255,255,.8);
  pointer-events:none;
}
.hint{
  text-align:center;
  color:#aaa;
  font-size:13px;
  margin:10px;
}
/* MODAL */
.modal{
  display:none;
  position:fixed;
  inset:0;
  z-index:100;
  background:rgba(0,0,0,.75);
  align-items:center;
  justify-content:center;
  padding:15px;
}
.modalBox{
  width:min(520px,100%);
  max-height:90vh;
  overflow:auto;
  background:#1d1d1d;
  border:1px solid #444;
  border-radius:20px;
  padding:22px;
}
.modalHeader{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:20px;
}
.close{
  background:#333;
  color:white;
  width:42px;
  height:42px;
  padding:0;
  border-radius:50%;
}
.option{
  border:1px solid #555;
  border-radius:15px;
  padding:16px;
  margin:10px 0;
  cursor:pointer;
  transition:.2s;
}
.option:hover,
.option.selected{
  border-color:#fff;
  background:#292929;
}
.optionTitle{
  font-size:18px;
  font-weight:bold;
}
.optionPrice{
  color:#bbb;
  margin-top:5px;
}
input{
  width:100%;
  padding:13px;
  margin-top:7px;
  margin-bottom:13px;
  border-radius:10px;
  border:1px solid #555;
  background:#111;
  color:white;
  font-size:16px;
}
label{
  font-size:14px;
  color:#ccc;
}
.previewBtn{
  width:100%;
  background:white;
  color:#111;
  margin-top:8px;
}
.result{
  margin-top:15px;
  padding:14px;
  border-radius:12px;
  background:#111;
  border:1px solid #444;
  display:none;
}
.success{
  color:#7cffaa;
}
.error{
  color:#ff7777;
}
.total{
  font-size:22px;
  font-weight:bold;
  margin-top:8px;
}
</style>
</head>
<body>
<header>
  <div>
    <div class="logoTitle">🧱 حيطان لبنان 🇱🇧</div>
    <div class="slogan">كل اسم إلو مطرح</div>
  </div>
  <button class="mainBtn" onclick="openModal()">
    + احجز مطرحك
  </button>
</header>
<div class="wallArea">
  <div class="wallViewport" id="viewport">
    <div class="wall" id="wall">
      <div class="graffiti g1">LEBANON</div>
      <div class="graffiti g2">BEIRUT</div>
      <div class="graffiti g3">SAIDA</div>
      <div class="graffiti g4">TYRE</div>
      <div class="centerZone">
        CENTER
      </div>
    </div>
  </div>
  <div class="hint">
    اسحب الحائط لاستكشافه
  </div>
</div>
<!-- MODAL -->
<div class="modal" id="modal">
  <div class="modalBox">
    <div class="modalHeader">
      <h2>احجز مطرحك</h2>
      <button class="close" onclick="closeModal()">×</button>
    </div>
    <div
      class="option"
      id="standardOption"
      onclick="selectType('Standard')"
    >
      <div class="optionTitle">
        STANDARD
      </div>
      <div class="optionPrice">
        $1 لكل وحدة
      </div>
    </div>
    <div
      class="option"
      id="centerOption"
      onclick="selectType('Center')"
    >
      <div class="optionTitle">
        CENTER ⭐
      </div>
      <div class="optionPrice">
        $5 لكل وحدة
      </div>
    </div>
    <div id="formArea" style="display:none">
      <label>
        عدد الوحدات
      </label>
      <input
        id="unitsCount"
        type="number"
        min="1"
        placeholder="مثلاً 20"
        oninput="calculatePrice()"
      >
      <div class="total">
        المجموع:
        $<span id="totalPrice">0</span>
      </div>
      <button
        class="previewBtn"
        onclick="previewArea()"
      >
        🔍 معاينة المساحة
      </button>
      <div
        class="result"
        id="result"
      ></div>
    </div>
  </div>
</div>
<script>
/* =========================
   SETTINGS
========================= */
const APP_URL =
"https://script.google.com/macros/s/AKfycbzyM_gJsIV-icWDh_sy95KhPqsQpeLlS6eyl__O2zVs1aZyQf-Bp5ja_FrhW9icSHuY/exec";
let selectedType = null;
/* =========================
   MODAL
========================= */
function openModal(){
  document.getElementById("modal").style.display="flex";
}
function closeModal(){
  document.getElementById("modal").style.display="none";
}
/* =========================
   SELECT TYPE
========================= */
function selectType(type){
  selectedType = type;
  document
    .getElementById("standardOption")
    .classList.remove("selected");
  document
    .getElementById("centerOption")
    .classList.remove("selected");
  if(type==="Standard"){
    document
      .getElementById("standardOption")
      .classList.add("selected");
  }else{
    document
      .getElementById("centerOption")
      .classList.add("selected");
  }
  document.getElementById("formArea").style.display="block";
  calculatePrice();
}
/* =========================
   PRICE
========================= */
function calculatePrice(){
  const count =
    Number(document.getElementById("unitsCount").value || 0);
  const price =
    selectedType==="Center" ? 5 : 1;
  document.getElementById("totalPrice").textContent =
    count * price;
}
/* =========================
   PREVIEW
========================= */
async function previewArea(){
  const count =
    Number(document.getElementById("unitsCount").value);
  const result =
    document.getElementById("result");
  if(!selectedType){
    showResult(
      "error",
      "اختر نوع المساحة أولاً."
    );
    return;
  }
  if(!count || count < 1){
    showResult(
      "error",
      "أدخل عدد الوحدات."
    );
    return;
  }
  showResult(
    "",
    "⏳ عم نبحث عن مساحة متصلة..."
  );
  try{
    const response =
      await fetch(APP_URL,{
        method:"POST",
        headers:{
          "Content-Type":"text/plain;charset=utf-8"
        },
        body:JSON.stringify({
          action:"preview",
          unitType:selectedType,
          unitsCount:count
        })
      });
    const data =
      await response.json();
    if(data.success){
      showResult(
        "success",
        `
        ✅ وجدنا مساحة متصلة.
        <div class="total">
        ${data.count} وحدة
        </div>
        <div style="margin-top:8px;color:#aaa">
        السعر: $${data.count * (selectedType==="Center" ? 5 : 1)}
        </div>
        `
      );
      drawPreview(data.unitIds);
    }else{
      showResult(
        "error",
        data.error || "لم نجد مساحة مناسبة."
      );
    }
  }catch(error){
    console.error(error);
    showResult(
      "error",
      "تعذر الاتصال بالخادم. تأكد أن Web App منشور ويعمل."
    );
  }
}
/* =========================
   RESULT
========================= */
function showResult(type,message){
  const result =
    document.getElementById("result");
  result.style.display="block";
  result.className =
    "result " + type;
  result.innerHTML=message;
}
/* =========================
   DRAW PREVIEW
========================= */
function drawPreview(unitIds){
  /*
    كل وحدة = 18 × 12 بكسل تقريباً
    لأن الحائط 100 × 100 وحدة
  */
  const wall =
    document.getElementById("wall");
  document
    .querySelectorAll(".unitPreview")
    .forEach(el=>el.remove());
  if(!unitIds || !unitIds.length) return;
  unitIds.forEach(id=>{
    const number =
      parseInt(id.substring(1));
    const index =
      number - 1;
    const row =
      Math.floor(index / 100);
    const col =
      index % 100;
    const unit =
      document.createElement("div");
    unit.className="unitPreview";
    unit.style.left =
      (col * 18) + "px";
    unit.style.top =
      (row * 12) + "px";
    unit.style.width="18px";
    unit.style.height="12px";
    wall.appendChild(unit);
  });
}
/* =========================
   CLOSE MODAL ON BACKGROUND
========================= */
document
  .getElementById("modal")
  .addEventListener("click",function(e){
    if(e.target===this){
      closeModal();
    }
  });
/* =========================
   DRAG WALL
========================= */
const viewport =
  document.getElementById("viewport");
const wall =
  document.getElementById("wall");
let dragging=false;
let startX=0;
let startY=0;
let wallX=0;
let wallY=0;
viewport.addEventListener(
  "pointerdown",
  e=>{
    dragging=true;
    startX=e.clientX;
    startY=e.clientY;
    viewport.setPointerCapture(e.pointerId);
  }
);
viewport.addEventListener(
  "pointermove",
  e=>{
    if(!dragging) return;
    wallX +=
      e.clientX-startX;
    wallY +=
      e.clientY-startY;
    startX=e.clientX;
    startY=e.clientY;
    wall.style.transform=
      `translate(${wallX}px,${wallY}px)`;
  }
);
viewport.addEventListener(
  "pointerup",
  ()=>{
    dragging=false;
  }
);
viewport.addEventListener(
  "pointercancel",
  ()=>{
    dragging=false;
  }
);
</script>
</body>
</html>
